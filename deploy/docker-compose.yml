x-env-file: &env_file
  - .env

name: yarr

services:
  yarr-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: yarr-backend
    image: yarr-backend:latest
    restart: unless-stopped
    env_file: *env_file
    environment:
      # 每日 4 点自动刷新订阅按此时区计算
      TZ: ${TZ:-Asia/Shanghai}

  yarr-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: yarr-frontend
    image: yarr-frontend:latest
    ports:
      - "7070:80"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      - yarr-backend
